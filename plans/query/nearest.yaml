# Qdrant's quickstart search: the three points nearest [0.2, 0.1, 0.9, 0.7] by dot product are
# New York, Berlin, and Moscow. Every way of asking agrees: the Query RPC with a vector, the
# deprecated Search RPC, and the REST query, where ids are bare numbers. A filter narrows the
# candidates before ranking; a query by a point's id ranks its neighbours and leaves the point out.
#
# Scores are float32. 1.362 reads back as 1.362, but a computed one such as 1.2218001 shows its
# last bits, so scores are asserted as ranges.
intent:
  goal: rest
  description: The quickstart's nearest neighbours, asked four ways, all agreeing

execution:
  steps:
    - id: create
      node: createCollection
      values:
        distance: Dot

    - id: upsert
      node: upsertPoints

    - id: nearest
      node: queryPoints
      dependsOn: [upsert]
      values:
        query: {default: {nearest: {dense: {data: [0.2, 0.1, 0.9, 0.7]}}}}
      assertions:
        mechanical:
          - type: fieldEquals
            path: nums
            value: ["4", "1", "3"]
          - type: fieldEquals
            path: cities
            value: [New York, Berlin, Moscow]
          - type: predicate
            expr: topScore > 1.3619 && topScore < 1.3621

    - id: filtered
      node: queryPoints
      dependsOn: [upsert]
      values:
        query: {default: {nearest: {dense: {data: [0.2, 0.1, 0.9, 0.7]}}}}
        filter: {default: {must: [{field: {key: city, match: {keyword: London}}}]}}
      assertions:
        mechanical:
          - type: fieldEquals
            path: nums
            value: ["2"]
          - type: predicate
            expr: topScore > 0.8709 && topScore < 0.8711

    - id: byId
      node: queryPoints
      dependsOn: [upsert]
      description: The neighbours of point 4, which is not among them
      values:
        query: {default: {nearest: {id: {num: "4"}}}}
        limit: 2
      assertions:
        mechanical:
          - type: fieldEquals
            path: nums
            value: ["1", "3"]

    - id: noQuery
      node: queryPoints
      dependsOn: [upsert]
      description: Without a query, points come in id order, each scored 1
      assertions:
        mechanical:
          - type: fieldEquals
            path: nums
            value: ["1", "2", "3"]
          - type: fieldEquals
            path: scores
            value: [1, 1, 1]

    - id: deprecated
      node: searchPoints
      dependsOn: [upsert]
      values:
        vector: [0.2, 0.1, 0.9, 0.7]
      assertions:
        mechanical:
          - type: fieldEquals
            path: nums
            value: ["4", "1", "3"]

    - id: rest
      node: restQueryPoints
      isGoal: true
      dependsOn: [upsert]
      values:
        vector: [0.2, 0.1, 0.9, 0.7]
      assertions:
        mechanical:
          - type: status
            expect: 200
          - type: fieldEquals
            path: ids
            value: [4, 1, 3]
