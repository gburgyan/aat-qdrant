name: id-uuid
description: >-
  The same six points with UUID ids: the PointId oneof's string member, written {"uuid": ...}.
  The UUIDs sort in the same order as the numbers, so a scroll reads the cities in the same order
  whichever kind of id they have.
selectionHint: Points identified by UUID
inputs:
  upsertPoints.points:
    value:
      - {id: {uuid: 00000000-0000-4000-8000-000000000001}, vectors: {vector: {dense: {data: [0.05, 0.61, 0.76, 0.74]}}}, payload: {city: {stringValue: Berlin}, country: {stringValue: Germany}, population: {integerValue: "3645000"}}}
      - {id: {uuid: 00000000-0000-4000-8000-000000000002}, vectors: {vector: {dense: {data: [0.19, 0.81, 0.75, 0.11]}}}, payload: {city: {stringValue: London}, country: {stringValue: UK}, population: {integerValue: "8982000"}}}
      - {id: {uuid: 00000000-0000-4000-8000-000000000003}, vectors: {vector: {dense: {data: [0.36, 0.55, 0.47, 0.94]}}}, payload: {city: {stringValue: Moscow}, country: {stringValue: Russia}, population: {integerValue: "12640000"}}}
      - {id: {uuid: 00000000-0000-4000-8000-000000000004}, vectors: {vector: {dense: {data: [0.18, 0.01, 0.85, 0.80]}}}, payload: {city: {stringValue: New York}, country: {stringValue: USA}, population: {integerValue: "8336000"}}}
      - {id: {uuid: 00000000-0000-4000-8000-000000000005}, vectors: {vector: {dense: {data: [0.24, 0.18, 0.22, 0.44]}}}, payload: {city: {stringValue: Beijing}, country: {stringValue: China}, population: {integerValue: "21540000"}}}
      - {id: {uuid: 00000000-0000-4000-8000-000000000006}, vectors: {vector: {dense: {data: [0.35, 0.08, 0.11, 0.44]}}}, payload: {city: {stringValue: Mumbai}, country: {stringValue: India}, population: {integerValue: "12480000"}}}
