# The local Qdrant that compose.yaml runs: scripts/up.sh starts it. Every node speaks gRPC to
# :6334 except the REST cross-checks, whose names start with `rest` and which go to :6333 — one
# server, two protocols, the same collections.
#
# The key is Qdrant's `api-key`, sent as gRPC metadata and as an HTTP header alike. It is the
# literal key compose.yaml gives the container: it guards a throwaway database on 127.0.0.1 and
# nothing else, so it is committed rather than read from the environment.
#
# `local` is the standalone node. `local-cluster` is the one-node cluster from the compose
# `cluster` profile, which is what shard keys need.
#
# Credential variants: a node whose name starts with anon, wrongKey, readOnly, jwtRead, jwtRbac, or
# jwtExpired sends that credential in place of the full key (each such node reuses another node's
# template). The JWTs are HS256, signed with the local key by scripts/mint-jwt.sh, and good only
# against this container:
#   jwtRead     {"access":"r"}                                                  global read
#   jwtRbac     {"access":[{"collection":"aat-qdrant-rbac","access":"rw"}]}     one collection
#   jwtExpired  {"access":"r","exp":1}                                          expired in 1970
#
# REST responses are checked against Qdrant's own OpenAPI spec (openapi/openapi.json) and fail a
# step when they don't match it. gRPC messages need no such setting: a response that doesn't
# decode against the protos fails the step anyway.
environments:
  _qdrant:
    notes: The local Qdrant from compose.yaml. Start it with scripts/up.sh.
    apiBaseUrl: grpc://localhost:6334
    auth:
      type: apikey
      headerName: api-key
      credentials:
        key: {source: literal, value: aat-qdrant-local-key}
    overrides:
      - match: "rest*"
        baseUrl: http://localhost:6333
      - match: "anon*"
        auth: {type: none}
      - match: "restAnon*"
        baseUrl: http://localhost:6333
        auth: {type: none}
      - match: "wrongKey*"
        auth:
          type: apikey
          headerName: api-key
          credentials:
            key: {source: literal, value: not-the-key}
      - match: "readOnly*"
        auth:
          type: apikey
          headerName: api-key
          credentials:
            key: {source: literal, value: aat-qdrant-local-read-only-key}
      - match: "jwtRead*"
        auth:
          type: bearer
          credentials:
            token: {source: literal, value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhY2Nlc3MiOiJyIn0.QNlFHKVbGazz6ikjultznWpr3RrAu0MZl2HSu_wF4zo}
      - match: "jwtRbac*"
        auth:
          type: bearer
          credentials:
            token: {source: literal, value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhY2Nlc3MiOlt7ImNvbGxlY3Rpb24iOiJhYXQtcWRyYW50LXJiYWMiLCJhY2Nlc3MiOiJydyJ9XX0.-ccc_scO5T4cBM8QpVtvS0_bmJVXiJEDKmFj-0potTI}
      - match: "jwtExpired*"
        auth:
          type: bearer
          credentials:
            token: {source: literal, value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhY2Nlc3MiOiJyIiwiZXhwIjoxfQ.pgEhqWgPsgFbz543Xr5yhI_Na-Ih2HI_x50rFDc9P3A}
    settings:
      oasValidation: strict

  local:
    extends: _qdrant
    notes: The standalone node (gRPC :6334, REST :6333).

  local-cluster:
    extends: _qdrant
    notes: >-
      The one-node cluster (gRPC :7334, REST :7333). Start it with `scripts/up.sh cluster`.
    apiBaseUrl: grpc://localhost:7334
    overrides:
      - match: "rest*"
        baseUrl: http://localhost:7333
      - match: "restAnon*"
        baseUrl: http://localhost:7333
        auth: {type: none}
