adapter: countPoints
protocol: grpc

request:
  rpc: qdrant.Points/Count
  message: |
    {
      "collectionName": "{{collectionName}}",
      "exact": true{{?filter}},
      "filter": {{filter}}{{/filter}}{{?shardKey}},
      "shardKeySelector": {"shardKeys": [{"keyword": "{{shardKey}}"}]}{{/shardKey}}
    }

response:
  extract:
    count: result.count
