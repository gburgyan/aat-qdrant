adapter: discoverPoints
protocol: grpc

request:
  rpc: qdrant.Points/Discover
  message: |
    {
      "collectionName": "{{collectionName}}",
      "target": {"single": {{target}}},
      "context": {{context}},
      "limit": "{{limit}}",
      "withPayload": {"enable": true}
    }

response:
  # Scores are float32: 1.2218001 rather than 1.2218. Ids are PointId oneofs; nums reads the
  # numeric ones.
  extract:
    nums: result.#.id.num
    ids: result.#.id
    scores: result.#.score
    cities: result.#.payload.city.stringValue
    count: "result.#"
    topScore:
      path: result.0.score
      optional: true
