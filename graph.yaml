version: "1.0.0"
title: Qdrant over gRPC
description: >-
  The Qdrant vector database, driven over its gRPC API (qdrant.Collections, qdrant.Points,
  qdrant.Snapshots) against a local container. A handful of REST nodes, named rest*, read the same
  collections back over HTTP to show what each protocol makes of the same data.

# Qdrant's own protos, compiled by proto/build.sh. aat validate checks every gRPC node against
# them without a server running.
proto: qdrant.protoset

# Qdrant's own OpenAPI spec, for the rest* nodes: aat validate checks them against it, and at run
# time a response it doesn't allow fails the step (settings.oasValidation in env.yaml).
oas: openapi/openapi.json

nodes:
  # --- Health ----------------------------------------------------------------

  healthCheck: &healthCheck
    description: >-
      Qdrant's own health check, which answers with its version. It is one of the two calls Qdrant
      serves without a key. Proven by plans/health/checks.yaml.
    adapter: healthCheck
    proto: qdrant.Qdrant/HealthCheck
    tags: [health]
    outputs:
      - name: title
        type: string
      - name: version
        type: string
        display: Qdrant
      - name: commit
        type: string
        optional: true

  grpcHealthCheck: &grpcHealthCheck
    description: >-
      The standard gRPC health service (grpc.health.v1.Health/Check), the other call served without
      a key. An empty service name asks about the server as a whole. Proven by
      plans/health/checks.yaml.
    adapter: grpcHealthCheck
    proto: grpc.health.v1.Health/Check
    tags: [health]
    inputs:
      - name: service
        type: string
        optional: true
        description: A service to ask about, such as qdrant.Points; empty or absent asks about the server
    outputs:
      - name: status
        type: string
        description: SERVING, NOT_SERVING, UNKNOWN, or SERVICE_UNKNOWN

  # --- Collections -----------------------------------------------------------

  createCollection:
    description: >-
      Create a collection of dense vectors. The name is the client's to choose and Qdrant answers
      only `result: true`, so the name comes back as an output echoed from the input. Every
      collection this project creates is named aat-qdrant-*, which is what the guard looks for, and
      carries `project: aat-qdrant` in its metadata. Proven by plans/collections/lifecycle.yaml.
    adapter: createCollection
    proto: qdrant.Collections/Create
    tags: [collections]
    inputs:
      - name: collectionName
        type: string
        default: {value: "aat-qdrant-{{random 8}}"}
      - name: vectorSize
        type: integer
        default: {value: 4}
        description: Dimensions of every vector in the collection
      - name: distance
        type: enum[Cosine, Euclid, Dot, Manhattan]
        default: {value: Cosine}
    outputs:
      - name: created
        type: boolean
      - name: collectionName
        type: string
        fromInput: collectionName
    satisfies: [collection]
    cleanup:
      node: deleteCollection

  createCollectionFromConfig:
    description: >-
      Create a collection from a vectors config written out in full: named vectors, multivectors,
      sparse vectors, and custom sharding, which createCollection's size and distance can't
      express. Like createCollection, it echoes the name it sent and is cleaned up by
      deleteCollection. Proven by plans/vectors/kinds.yaml.
    adapter: createCollectionFromConfig
    proto: qdrant.Collections/Create
    tags: [collections]
    inputs:
      - name: collectionName
        type: string
        default: {value: "aat-qdrant-{{random 8}}"}
      - name: vectorsConfig
        type: VectorsConfig
        optional: true
        description: "A qdrant.VectorsConfig oneof: {params: {...}} or {paramsMap: {map: {...}}}"
      - name: sparseVectorsConfig
        type: SparseVectorConfig
        optional: true
      - name: shardingMethod
        type: enum[Auto, Custom]
        optional: true
    outputs:
      - name: created
        type: boolean
      - name: collectionName
        type: string
        fromInput: collectionName
    satisfies: [collection]
    cleanup:
      node: deleteCollection

  getCollection: &getCollection
    description: >-
      Read a collection's status and configuration. Over gRPC the status is the enum name, `Green`;
      over REST it is `green`. Proven by plans/collections/lifecycle.yaml.
    adapter: getCollection
    proto: qdrant.Collections/Get
    tags: [collections]
    requires: [collection]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
    outputs:
      - name: status
        type: string
        description: Green, Yellow, Grey, or Red
      - name: pointsCount
        type: integer
        optional: true
      - name: segmentsCount
        type: integer
      - name: vectorSize
        type: integer
        optional: true
        description: The unnamed vector's size, when the collection has only that one
      - name: distance
        type: string
        optional: true
      - name: vectorNames
        type: string[]
        description: >-
          The names in a collection's vector map, sorted. A collection with one unnamed vector
          has none; once a named vector is added, the unnamed one is listed as "".
      - name: indexingThreshold
        type: integer
      - name: payloadSchema
        type: string[]
        description: The payload fields that have an index, sorted
      - name: project
        type: string
        optional: true
        description: The project tag in the collection's metadata
      - name: note
        type: string
        optional: true
        description: The note tag in the collection's metadata, which updateCollection sets

  listCollections: &listCollections
    description: >-
      List every collection on the server. The transform counts this project's (named aat-qdrant-*),
      which is what the guard asserts is zero. Proven by plans/zz-guard/no-stray-collections.yaml.
    adapter: listCollections
    proto: qdrant.Collections/List
    tags: [collections]
    outputs:
      - name: names
        type: string[]
      - name: count
        type: integer
      - name: ourCount
        type: integer
      - name: ours
        type: string[]

  collectionExists:
    description: >-
      Whether a collection exists. `false` is a real answer rather than an error, and it arrives as
      a present `false`, not an absent field. Proven by plans/collections/missing.yaml.
    adapter: collectionExists
    proto: qdrant.Collections/CollectionExists
    tags: [collections]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
    outputs:
      - name: exists
        type: boolean

  updateCollection:
    description: >-
      Change a collection's optimizer settings and metadata in place. Metadata is merged: a key
      the update doesn't name keeps its value. Proven by plans/collections/update-optimizers.yaml.
    adapter: updateCollection
    proto: qdrant.Collections/Update
    tags: [collections]
    requires: [collection]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: indexingThreshold
        type: integer
        default: {value: 20000}
        description: Vectors a segment holds before Qdrant builds its HNSW index, in kilobytes
      - name: note
        type: string
        default: {value: updated by aat-qdrant}
        description: Written to the collection's metadata as `note`
    outputs:
      - name: updated
        type: boolean

  deleteCollection: &deleteCollection
    description: >-
      Delete a collection and everything in it; the cleanup for createCollection. Deleting one that
      doesn't exist answers `result: false` rather than NOT_FOUND. Proven by
      plans/collections/lifecycle.yaml.
    adapter: deleteCollection
    proto: qdrant.Collections/Delete
    tags: [collections, cleanup]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
    outputs:
      - name: deleted
        type: boolean

  # --- Aliases ---------------------------------------------------------------

  createAlias:
    description: >-
      Give a collection a second name that reads and writes go through. Creating an alias that
      already exists succeeds again. Proven by plans/aliases/lifecycle.yaml.
    adapter: createAlias
    proto: qdrant.Collections/UpdateAliases
    tags: [aliases]
    requires: [collection]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: aliasName
        type: string
        default: {value: "aat-qdrant-alias-{{random 8}}"}
    outputs:
      - name: done
        type: boolean
      - name: aliasName
        type: string
        fromInput: aliasName
    satisfies: [alias]
    cleanup:
      node: deleteAlias

  renameAlias:
    description: >-
      Rename an alias. Its cleanup deletes the new name; the old one's cleanup finds nothing to
      delete, which Qdrant answers with success. Proven by plans/aliases/lifecycle.yaml.
    adapter: renameAlias
    proto: qdrant.Collections/UpdateAliases
    tags: [aliases]
    requires: [alias]
    inputs:
      - name: oldAliasName
        type: string
        default: {from: createAlias.aliasName}
      - name: aliasName
        type: string
        default: {value: "aat-qdrant-alias-{{random 8}}"}
        description: The new name
    outputs:
      - name: done
        type: boolean
      - name: aliasName
        type: string
        fromInput: aliasName
    cleanup:
      node: deleteAlias

  deleteAlias:
    description: >-
      Remove an alias, leaving its collection. Removing one that doesn't exist also succeeds. The
      cleanup for createAlias and renameAlias. Proven by plans/aliases/lifecycle.yaml.
    adapter: deleteAlias
    proto: qdrant.Collections/UpdateAliases
    tags: [aliases, cleanup]
    inputs:
      - name: aliasName
        type: string
        default: {from: createAlias.aliasName}
    outputs:
      - name: done
        type: boolean

  updateAliases:
    description: >-
      Apply several alias actions at once, each an AliasOperations oneof (createAlias, renameAlias,
      deleteAlias), atomically: the way to point an alias at a new collection with no moment in
      which it points nowhere. Proven by plans/aliases/blue-green.yaml.
    adapter: updateAliases
    proto: qdrant.Collections/UpdateAliases
    tags: [aliases]
    inputs:
      - name: actions
        type: AliasOperations[]
    outputs:
      - name: done
        type: boolean

  listAliases:
    description: >-
      Every alias on the server. The transform counts this project's (named aat-qdrant-*), which the
      guard asserts is zero. Proven by plans/zz-guard/no-stray-aliases.yaml.
    adapter: listAliases
    proto: qdrant.Collections/ListAliases
    tags: [aliases]
    outputs:
      - name: names
        type: string[]
      - name: count
        type: integer
      - name: ourCount
        type: integer

  listCollectionAliases:
    description: A collection's aliases. Proven by plans/aliases/lifecycle.yaml.
    adapter: listCollectionAliases
    proto: qdrant.Collections/ListCollectionAliases
    tags: [aliases]
    requires: [collection]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
    outputs:
      - name: names
        type: string[]
      - name: count
        type: integer

  # --- Cluster and shard keys --------------------------------------------------

  collectionClusterInfo:
    description: >-
      A collection's shards and where they live. On a standalone node it is one local shard, shard
      0, which proto3 JSON writes as a present 0. Proven by plans/cluster/standalone.yaml.
    adapter: collectionClusterInfo
    proto: qdrant.Collections/CollectionClusterInfo
    tags: [cluster]
    requires: [collection]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
    outputs:
      - name: peerId
        type: string
      - name: shardCount
        type: integer
      - name: shardIds
        type: integer[]
      - name: shardKeys
        type: string[]
      - name: pointsCounts
        type: string[]

  updateCollectionClusterSetup:
    description: >-
      Change a collection's cluster layout. The operation is a oneof; this node sends its
      shard-key members. On a standalone node it is UNIMPLEMENTED. Proven by
      plans/cluster/standalone.yaml and cluster/shard-keys.yaml.
    adapter: updateCollectionClusterSetup
    proto: qdrant.Collections/UpdateCollectionClusterSetup
    tags: [cluster]
    requires: [collection]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: createKey
        type: string
        optional: true
        description: A keyword shard key to create
      - name: deleteKey
        type: string
        optional: true
        description: A keyword shard key to delete
    outputs:
      - name: done
        type: boolean

  createShardKey:
    description: >-
      Add a keyword shard key to a custom-sharded collection. It needs cluster mode: on a standalone
      node it is UNIMPLEMENTED. Proven by cluster/shard-keys.yaml.
    adapter: createShardKey
    proto: qdrant.Collections/CreateShardKey
    tags: [cluster]
    requires: [collection]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: shardKey
        type: string
        default: {value: eu}
    outputs:
      - name: created
        type: boolean
      - name: shardKey
        type: string
        fromInput: shardKey
    cleanup:
      node: deleteShardKey

  deleteShardKey:
    description: Remove a shard key and its shards; the cleanup for createShardKey. Proven by cluster/shard-keys.yaml.
    adapter: deleteShardKey
    proto: qdrant.Collections/DeleteShardKey
    tags: [cluster, cleanup]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: shardKey
        type: string
        default: {from: createShardKey.shardKey}
    outputs:
      - name: deleted
        type: boolean

  listShardKeys:
    description: >-
      A collection's shard keys. On a standalone node the answer is an empty list, not an error.
      Proven by plans/cluster/standalone.yaml.
    adapter: listShardKeys
    proto: qdrant.Collections/ListShardKeys
    tags: [cluster]
    requires: [collection]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
    outputs:
      - name: keys
        type: string[]
      - name: count
        type: integer

  # --- Snapshots ---------------------------------------------------------------

  createSnapshot:
    description: >-
      Snapshot one collection. The description's creationTime is a google.protobuf.Timestamp, which
      arrives as an RFC 3339 string, and its size an int64, as a string. Proven by
      plans/snapshots/collection.yaml.
    adapter: createSnapshot
    proto: qdrant.Snapshots/Create
    tags: [snapshots]
    requires: [collection]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
    outputs:
      - name: snapshotName
        type: string
      - name: creationTime
        type: datetime
      - name: size
        type: integer
      - name: checksum
        type: string
        optional: true
    cleanup:
      node: deleteSnapshot

  listSnapshots:
    description: >-
      A collection's snapshots. For a collection that doesn't exist, NOT_FOUND. Proven by
      plans/snapshots/collection.yaml.
    adapter: listSnapshots
    proto: qdrant.Snapshots/List
    tags: [snapshots]
    requires: [collection]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
    outputs:
      - name: names
        type: string[]
      - name: count
        type: integer

  deleteSnapshot:
    description: Delete a collection snapshot; the cleanup for createSnapshot. Proven by plans/snapshots/collection.yaml.
    adapter: deleteSnapshot
    proto: qdrant.Snapshots/Delete
    tags: [snapshots, cleanup]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: snapshotName
        type: string
        default: {from: createSnapshot.snapshotName}

  createFullSnapshot:
    description: >-
      Snapshot the whole storage, every collection. A full snapshot outlives the collections in it,
      so it needs a cleanup of its own. Proven by plans/snapshots/full.yaml.
    adapter: createFullSnapshot
    proto: qdrant.Snapshots/CreateFull
    tags: [snapshots]
    outputs:
      - name: snapshotName
        type: string
      - name: creationTime
        type: datetime
      - name: size
        type: integer
    cleanup:
      node: deleteFullSnapshot

  listFullSnapshots:
    description: >-
      Every full snapshot. The guard asserts there are none left, which holds on this project's own
      throwaway container. Proven by plans/zz-guard/no-stray-full-snapshots.yaml.
    adapter: listFullSnapshots
    proto: qdrant.Snapshots/ListFull
    tags: [snapshots]
    outputs:
      - name: names
        type: string[]
      - name: count
        type: integer

  deleteFullSnapshot:
    description: Delete a full snapshot; the cleanup for createFullSnapshot. Proven by plans/snapshots/full.yaml.
    adapter: deleteFullSnapshot
    proto: qdrant.Snapshots/DeleteFull
    tags: [snapshots, cleanup]
    inputs:
      - name: snapshotName
        type: string
        default: {from: createFullSnapshot.snapshotName}

  # --- Points ----------------------------------------------------------------

  upsertPoints: &upsertPoints
    description: >-
      Insert or replace points. Each is a qdrant.PointStruct in proto3 JSON: an id that is a
      oneof of a uint64 (`{"num": "1"}`) or a UUID (`{"uuid": "..."}`), vectors, and a payload
      of Qdrant Value messages. The default is Qdrant's own quickstart dataset of six cities. With
      `wait` the reply comes after the write is applied (Completed); without it, as soon as it is
      accepted (Acknowledged). Proven by plans/points/upsert-and-read.yaml.
    adapter: upsertPoints
    proto: qdrant.Points/Upsert
    tags: [points]
    requires: [collection]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: points
        type: PointStruct[]
        default:
          value:
            - {id: {num: "1"}, vectors: {vector: {dense: {data: [0.05, 0.61, 0.76, 0.74]}}}, payload: {city: {stringValue: Berlin}, country: {stringValue: Germany}, population: {integerValue: "3645000"}}}
            - {id: {num: "2"}, vectors: {vector: {dense: {data: [0.19, 0.81, 0.75, 0.11]}}}, payload: {city: {stringValue: London}, country: {stringValue: UK}, population: {integerValue: "8982000"}}}
            - {id: {num: "3"}, vectors: {vector: {dense: {data: [0.36, 0.55, 0.47, 0.94]}}}, payload: {city: {stringValue: Moscow}, country: {stringValue: Russia}, population: {integerValue: "12640000"}}}
            - {id: {num: "4"}, vectors: {vector: {dense: {data: [0.18, 0.01, 0.85, 0.80]}}}, payload: {city: {stringValue: New York}, country: {stringValue: USA}, population: {integerValue: "8336000"}}}
            - {id: {num: "5"}, vectors: {vector: {dense: {data: [0.24, 0.18, 0.22, 0.44]}}}, payload: {city: {stringValue: Beijing}, country: {stringValue: China}, population: {integerValue: "21540000"}}}
            - {id: {num: "6"}, vectors: {vector: {dense: {data: [0.35, 0.08, 0.11, 0.44]}}}, payload: {city: {stringValue: Mumbai}, country: {stringValue: India}, population: {integerValue: "12480000"}}}
      - name: wait
        type: boolean
        default: {value: true}
      - name: shardKey
        type: string
        optional: true
        description: The shard key to write to, which a custom-sharded collection requires
    outputs:
      - name: status
        type: string
        description: Completed, or Acknowledged when the write was not waited for
      - name: operationId
        type: integer
        optional: true
    satisfies: [points]

  getPoints:
    description: >-
      Read points by id. An id with no point is not an error: it is left out of the result.
      Proven by plans/points/upsert-and-read.yaml.
    adapter: getPoints
    proto: qdrant.Points/Get
    tags: [points]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: ids
        type: PointId[]
        default: {value: [{num: "1"}]}
      - name: withVectors
        type: boolean
        default: {value: false}
    outputs:
      - name: count
        type: integer
      - name: ids
        type: PointId[]
      - name: cities
        type: string[]
      - name: firstPayload
        type: Payload
        optional: true
      - name: firstVector
        type: float[]
        optional: true
        description: The first point's unnamed dense vector, when it has one and withVectors is set
      - name: firstNamedVectors
        type: NamedVectors
        optional: true
        description: The first point's named vectors, when it has them and withVectors is set

  deletePoints:
    description: >-
      Delete points, chosen either by id or by a filter: the request's selector is a oneof.
      Proven by plans/points/delete-and-count.yaml.
    adapter: deletePoints
    proto: qdrant.Points/Delete
    tags: [points]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: ids
        type: PointId[]
        optional: true
      - name: filter
        type: Filter
        optional: true
    outputs:
      - name: status
        type: string

  countPoints: &countPoints
    description: >-
      Count points, all of them or those a filter matches. The count is a uint64, so it arrives
      as a string. Proven by plans/points/delete-and-count.yaml.
    adapter: countPoints
    proto: qdrant.Points/Count
    tags: [points]
    requires: [collection]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: filter
        type: Filter
        optional: true
      - name: shardKey
        type: string
        optional: true
        description: Count only the points under this shard key
    outputs:
      - name: count
        type: integer

  scrollPoints:
    description: >-
      Page through points in id order. The cursor, nextPageOffset, is a PointId: a oneof, so it
      comes back as {"num": ...} or {"uuid": ...}, and is absent on the last page. AAT pages with
      string cursors, so the node splits it into nextNum and nextUuid, one of which is set, and
      sends back whichever came. Proven by plans/points/scroll-pages.yaml.
    adapter: scrollPoints
    proto: qdrant.Points/Scroll
    tags: [points]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: limit
        type: integer
        default: {value: 2}
      - name: offsetNum
        type: string
        optional: true
        description: Start the page at this numeric id; with neither offset, it starts at the lowest
      - name: offsetUuid
        type: string
        optional: true
        description: Start the page at this UUID id
      - name: filter
        type: Filter
        optional: true
    outputs:
      - name: ids
        type: PointId[]
      - name: cities
        type: string[]
      - name: count
        type: integer
      - name: nextPageOffset
        type: PointId
        optional: true
      - name: nextNum
        type: string
        description: The cursor's numeric id, or "" when it is a UUID or there is no next page
      - name: nextUuid
        type: string
        description: The cursor's UUID, or "" when it is numeric or there is no next page

  updateVectors:
    description: >-
      Replace the vectors of existing points, leaving their payloads alone. Proven by
      plans/points/vectors.yaml.
    adapter: updateVectors
    proto: qdrant.Points/UpdateVectors
    tags: [points, vectors]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: points
        type: PointVectors[]
        description: Each a qdrant.PointVectors in proto3 JSON, an id and its new vectors
    outputs:
      - name: status
        type: string

  deleteVectors:
    description: >-
      Remove named vectors from points, keeping the points and their payloads. The unnamed
      vector is the one named "". Proven by plans/points/vectors.yaml.
    adapter: deleteVectors
    proto: qdrant.Points/DeleteVectors
    tags: [points, vectors]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: ids
        type: PointId[]
      - name: vectorNames
        type: string[]
        default: {value: [""]}
    outputs:
      - name: status
        type: string

  setPayload:
    description: >-
      Merge values into points' payloads. With `key`, the values go under that key as a nested
      object instead of at the top level. Proven by plans/points/payload.yaml.
    adapter: setPayload
    proto: qdrant.Points/SetPayload
    tags: [points, payload]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: ids
        type: PointId[]
      - name: payload
        type: Payload
        description: A map of Qdrant Value messages, as in a point's payload
      - name: key
        type: string
        optional: true
    outputs:
      - name: status
        type: string

  overwritePayload:
    description: >-
      Replace points' payloads outright: a key the new payload doesn't have is gone. Proven by
      plans/points/payload.yaml.
    adapter: overwritePayload
    proto: qdrant.Points/OverwritePayload
    tags: [points, payload]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: ids
        type: PointId[]
      - name: payload
        type: Payload
    outputs:
      - name: status
        type: string

  deletePayload:
    description: Remove payload keys from points. Proven by plans/points/payload.yaml.
    adapter: deletePayload
    proto: qdrant.Points/DeletePayload
    tags: [points, payload]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: ids
        type: PointId[]
      - name: keys
        type: string[]
    outputs:
      - name: status
        type: string

  clearPayload:
    description: Remove every payload key from points. Proven by plans/points/payload.yaml.
    adapter: clearPayload
    proto: qdrant.Points/ClearPayload
    tags: [points, payload]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: ids
        type: PointId[]
    outputs:
      - name: status
        type: string

  updateBatch:
    description: >-
      Apply several point operations in one call, in order. Each operation is a oneof (upsert,
      setPayload, deletePoints, ...), and each gets its own result. Proven by
      plans/points/update-batch.yaml.
    adapter: updateBatch
    proto: qdrant.Points/UpdateBatch
    tags: [points]
    requires: [collection]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: operations
        type: PointsUpdateOperation[]
    outputs:
      - name: statuses
        type: string[]
      - name: count
        type: integer

  createFieldIndex:
    description: >-
      Index a payload field, which filters, facets, and ordered scrolls use. The field type is an
      enum whose zero value, FieldTypeKeyword, has to be written out, because the field is
      optional. Proven by plans/points/indexes.yaml.
    adapter: createFieldIndex
    proto: qdrant.Points/CreateFieldIndex
    tags: [points, indexes]
    requires: [collection]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: fieldName
        type: string
        default: {value: city}
      - name: fieldType
        type: enum[FieldTypeKeyword, FieldTypeInteger, FieldTypeFloat, FieldTypeGeo, FieldTypeText, FieldTypeBool, FieldTypeDatetime, FieldTypeUuid]
        default: {value: FieldTypeKeyword}
    outputs:
      - name: status
        type: string
      - name: fieldName
        type: string
        fromInput: fieldName
    cleanup:
      node: deleteFieldIndex

  deleteFieldIndex:
    description: Drop a payload field's index; the cleanup for createFieldIndex. Proven by plans/points/indexes.yaml.
    adapter: deleteFieldIndex
    proto: qdrant.Points/DeleteFieldIndex
    tags: [points, indexes, cleanup]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: fieldName
        type: string
        default: {from: createFieldIndex.fieldName}
    outputs:
      - name: status
        type: string

  createVectorName:
    description: >-
      Add a named dense vector to an existing collection. On a collection that had one unnamed
      vector, the collection's config becomes a map of named vectors, in which the unnamed one is
      named "". Proven by plans/points/vectors.yaml.
    adapter: createVectorName
    proto: qdrant.Points/CreateVectorName
    tags: [points, vectors]
    requires: [collection]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: vectorName
        type: string
        default: {value: extra}
      - name: size
        type: integer
        default: {value: 2}
      - name: distance
        type: enum[Cosine, Euclid, Dot, Manhattan]
        default: {value: Euclid}
    outputs:
      - name: status
        type: string
      - name: vectorName
        type: string
        fromInput: vectorName
    cleanup:
      node: deleteVectorName

  deleteVectorName:
    description: >-
      Remove a named vector from a collection and from every point; the cleanup for
      createVectorName. Proven by plans/points/vectors.yaml.
    adapter: deleteVectorName
    proto: qdrant.Points/DeleteVectorName
    tags: [points, vectors, cleanup]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: vectorName
        type: string
        default: {from: createVectorName.vectorName}
    outputs:
      - name: status
        type: string

  # --- Search and query ------------------------------------------------------

  queryPoints:
    description: >-
      The universal query: nearest neighbours of a vector or a point, a recommendation, discovery,
      a fusion of prefetched results, and more, each a member of the Query oneof. Without a query it
      lists points in id order. A fusion is {"fusion": "RRF"}, the enum's zero value, sent because
      it is a oneof member. Scores are float32, so assert them as ranges. Proven by
      plans/query/nearest.yaml.
    adapter: queryPoints
    proto: qdrant.Points/Query
    tags: [query]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: query
        type: Query
        optional: true
        description: "A qdrant.Query in proto3 JSON, such as {nearest: {dense: {data: [...]}}}"
      - name: prefetch
        type: PrefetchQuery[]
        optional: true
      - name: filter
        type: Filter
        optional: true
      - name: using
        type: string
        optional: true
        description: Which named vector to search; a collection with only named vectors needs one
      - name: limit
        type: integer
        default: {value: 3}
    outputs:
      - name: nums
        type: string[]
        description: The numeric ids of the points found, best first (uint64s, so strings)
      - name: ids
        type: PointId[]
      - name: scores
        type: float[]
      - name: cities
        type: string[]
      - name: count
        type: integer
      - name: topScore
        type: float
        optional: true

  queryBatch:
    description: >-
      Several queries in one call, each answered on its own. Every query in the batch has to name
      the collection again: the template writes it into each. Proven by plans/query/batches.yaml.
    adapter: queryBatch
    proto: qdrant.Points/QueryBatch
    tags: [query]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: queries
        type: QueryItem[]
        description: Each {query, limit}, as queryPoints takes them
    outputs:
      - name: batches
        type: NumLists
        description: For each request in the batch, the numeric ids it found, best first
      - name: count
        type: integer

  queryGroups:
    description: >-
      A query whose results are grouped by a payload field, a few hits per group. A group's key is
      a GroupId oneof. Proven by plans/query/groups.yaml.
    adapter: queryGroups
    proto: qdrant.Points/QueryGroups
    tags: [query]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: query
        type: Query
      - name: groupBy
        type: string
        default: {value: country}
      - name: groupSize
        type: integer
        default: {value: 1}
      - name: limit
        type: integer
        default: {value: 2}
    outputs:
      - name: groupIds
        type: string[]
        description: Each group's key, a GroupId oneof read as its string value
      - name: hitNums
        type: NumLists
        description: The numeric ids in each group, best first
      - name: count
        type: integer

  facet:
    description: >-
      Count points by the values of a payload field. It needs an index on the field that supports
      exact matches, such as a keyword index, and says so when there is none. Hits are ordered by
      count, then by value. Proven by plans/query/facet.yaml.
    adapter: facet
    proto: qdrant.Points/Facet
    tags: [query]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: key
        type: string
        default: {value: country}
      - name: limit
        type: integer
        default: {value: 10}
    outputs:
      - name: values
        type: string[]
      - name: counts
        type: integer[]
      - name: count
        type: integer

  searchMatrixPairs:
    description: >-
      For a sample of points, each one's nearest neighbours, as pairs. Proven by
      plans/query/matrix.yaml.
    adapter: searchMatrixPairs
    proto: qdrant.Points/SearchMatrixPairs
    tags: [query]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: sample
        type: integer
        default: {value: 6}
      - name: limit
        type: integer
        default: {value: 1}
    outputs:
      - name: count
        type: integer
      - name: aNums
        type: string[]
      - name: bNums
        type: string[]

  searchMatrixOffsets:
    description: >-
      The same matrix as searchMatrixPairs, as a sparse matrix: row and column offsets into a list
      of ids, and a score for each. Proven by plans/query/matrix.yaml.
    adapter: searchMatrixOffsets
    proto: qdrant.Points/SearchMatrixOffsets
    tags: [query]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: sample
        type: integer
        default: {value: 6}
      - name: limit
        type: integer
        default: {value: 1}
    outputs:
      - name: offsetsRow
        type: string[]
      - name: offsetsCol
        type: string[]
      - name: idNums
        type: string[]
      - name: scores
        type: float[]

  # --- Search and query: the deprecated RPCs --------------------------------
  # Marked deprecated in the protos in favour of Query, and still served.

  searchPoints:
    description: >-
      Nearest neighbours of a vector (deprecated; Query does this). Proven by
      plans/query/nearest.yaml.
    adapter: searchPoints
    proto: qdrant.Points/Search
    tags: [query, deprecated]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: vector
        type: float[]
      - name: limit
        type: integer
        default: {value: 3}
    outputs:
      - name: nums
        type: string[]
        description: The numeric ids of the points found, best first (uint64s, so strings)
      - name: ids
        type: PointId[]
      - name: scores
        type: float[]
      - name: cities
        type: string[]
      - name: count
        type: integer
      - name: topScore
        type: float
        optional: true

  searchBatch:
    description: >-
      Several searches in one call (deprecated; QueryBatch does this). Each names the collection
      again. Proven by plans/query/batches.yaml.
    adapter: searchBatch
    proto: qdrant.Points/SearchBatch
    tags: [query, deprecated]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: searches
        type: SearchItem[]
        description: Each {vector, limit}
    outputs:
      - name: batches
        type: NumLists
        description: For each request in the batch, the numeric ids it found, best first
      - name: count
        type: integer

  searchGroups:
    description: Nearest neighbours grouped by a payload field (deprecated; QueryGroups does this). Proven by plans/query/groups.yaml.
    adapter: searchGroups
    proto: qdrant.Points/SearchGroups
    tags: [query, deprecated]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: vector
        type: float[]
      - name: groupBy
        type: string
        default: {value: country}
      - name: groupSize
        type: integer
        default: {value: 1}
      - name: limit
        type: integer
        default: {value: 2}
    outputs:
      - name: groupIds
        type: string[]
        description: Each group's key, a GroupId oneof read as its string value
      - name: hitNums
        type: NumLists
        description: The numeric ids in each group, best first
      - name: count
        type: integer

  recommendPoints:
    description: >-
      Points like some and unlike others (deprecated; a recommend query does this). Proven by
      plans/query/recommend-and-discover.yaml.
    adapter: recommendPoints
    proto: qdrant.Points/Recommend
    tags: [query, deprecated]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: positive
        type: PointId[]
      - name: negative
        type: PointId[]
        default: {value: []}
      - name: limit
        type: integer
        default: {value: 2}
    outputs:
      - name: nums
        type: string[]
        description: The numeric ids of the points found, best first (uint64s, so strings)
      - name: ids
        type: PointId[]
      - name: scores
        type: float[]
      - name: cities
        type: string[]
      - name: count
        type: integer
      - name: topScore
        type: float
        optional: true

  recommendBatch:
    description: Several recommendations in one call (deprecated). Each names the collection again. Proven by plans/query/batches.yaml.
    adapter: recommendBatch
    proto: qdrant.Points/RecommendBatch
    tags: [query, deprecated]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: recommendations
        type: RecommendItem[]
        description: Each {positive, limit}
    outputs:
      - name: batches
        type: NumLists
        description: For each request in the batch, the numeric ids it found, best first
      - name: count
        type: integer

  recommendGroups:
    description: Recommendations grouped by a payload field (deprecated). Proven by plans/query/groups.yaml.
    adapter: recommendGroups
    proto: qdrant.Points/RecommendGroups
    tags: [query, deprecated]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: positive
        type: PointId[]
      - name: groupBy
        type: string
        default: {value: country}
      - name: groupSize
        type: integer
        default: {value: 1}
      - name: limit
        type: integer
        default: {value: 2}
    outputs:
      - name: groupIds
        type: string[]
        description: Each group's key, a GroupId oneof read as its string value
      - name: hitNums
        type: NumLists
        description: The numeric ids in each group, best first
      - name: count
        type: integer

  discoverPoints:
    description: >-
      Points near a target and on the positive side of context pairs (deprecated; a discover query
      does this). The target is a TargetVector whose only oneof member is `single`. Proven by
      plans/query/recommend-and-discover.yaml.
    adapter: discoverPoints
    proto: qdrant.Points/Discover
    tags: [query, deprecated]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: target
        type: VectorExample
      - name: context
        type: ContextExamplePair[]
      - name: limit
        type: integer
        default: {value: 2}
    outputs:
      - name: nums
        type: string[]
        description: The numeric ids of the points found, best first (uint64s, so strings)
      - name: ids
        type: PointId[]
      - name: scores
        type: float[]
      - name: cities
        type: string[]
      - name: count
        type: integer
      - name: topScore
        type: float
        optional: true

  discoverBatch:
    description: Several discoveries in one call (deprecated). Each names the collection again. Proven by plans/query/batches.yaml.
    adapter: discoverBatch
    proto: qdrant.Points/DiscoverBatch
    tags: [query, deprecated]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: discoveries
        type: DiscoverItem[]
        description: Each {target, context, limit}
    outputs:
      - name: batches
        type: NumLists
        description: For each request in the batch, the numeric ids it found, best first
      - name: count
        type: integer

  # --- Credentials and limits ------------------------------------------------
  # Each node here is another node sent with a different credential: env.yaml routes its name
  # prefix (anon, wrongKey, readOnly, jwtRead, jwtRbac, jwtExpired) to that credential, and the
  # node reuses the other's template, inputs, and outputs through a YAML merge key.

  anonHealthCheck:
    <<: *healthCheck
    description: healthCheck with no credential, which Qdrant serves anyway. Proven by plans/auth/keys.yaml.
    tags: [health, auth]

  anonGrpcHealthCheck:
    <<: *grpcHealthCheck
    description: grpcHealthCheck with no credential, which Qdrant serves anyway. Proven by plans/auth/keys.yaml.
    tags: [health, auth]

  anonListCollections:
    <<: *listCollections
    description: listCollections with no credential, which is UNAUTHENTICATED. Proven by plans/auth/keys.yaml.
    tags: [auth]

  wrongKeyListCollections:
    <<: *listCollections
    description: listCollections with a key Qdrant doesn't know, also UNAUTHENTICATED. Proven by plans/auth/keys.yaml.
    tags: [auth]

  readOnlyListCollections:
    <<: *listCollections
    description: listCollections with the read-only key, which reads freely. Proven by plans/auth/read-only-key.yaml.
    tags: [auth]

  readOnlyCountPoints:
    <<: *countPoints
    description: countPoints with the read-only key. Proven by plans/auth/read-only-key.yaml.
    tags: [auth]

  readOnlyUpsertPoints:
    <<: *upsertPoints
    description: upsertPoints with the read-only key, which is PERMISSION_DENIED. Proven by plans/auth/read-only-key.yaml.
    tags: [auth]

  readOnlyDeleteCollection:
    <<: *deleteCollection
    description: deleteCollection with the read-only key, which is PERMISSION_DENIED. Proven by plans/auth/read-only-key.yaml.
    tags: [auth]

  jwtReadListCollections:
    <<: *listCollections
    description: listCollections with a global read-only JWT. Proven by plans/auth/jwt.yaml.
    tags: [auth]

  jwtReadUpsertPoints:
    <<: *upsertPoints
    description: upsertPoints with a global read-only JWT, which is PERMISSION_DENIED. Proven by plans/auth/jwt.yaml.
    tags: [auth]

  jwtRbacListCollections:
    <<: *listCollections
    description: >-
      listCollections with a JWT for one collection, which lists that collection alone rather than
      being refused. Proven by plans/auth/jwt.yaml.
    tags: [auth]

  jwtRbacUpsertPoints:
    <<: *upsertPoints
    description: upsertPoints with a JWT for this collection, which may write its points. Proven by plans/auth/jwt.yaml.
    tags: [auth]

  jwtRbacGetCollection:
    <<: *getCollection
    description: getCollection with a JWT for another collection, which is PERMISSION_DENIED. Proven by plans/auth/jwt.yaml.
    tags: [auth]

  jwtRbacDeleteCollection:
    <<: *deleteCollection
    description: >-
      deleteCollection with a read-write JWT for that very collection, which is still
      PERMISSION_DENIED: deleting a collection needs global access. Proven by plans/auth/jwt.yaml.
    tags: [auth]

  jwtExpiredListCollections:
    <<: *listCollections
    description: >-
      listCollections with an expired JWT, which is PERMISSION_DENIED, not UNAUTHENTICATED: Qdrant
      reads a token it can verify but won't honour as forbidden. Proven by plans/auth/jwt.yaml.
    tags: [auth]

  updateStrictMode:
    description: >-
      Turn on a collection's strict mode, which refuses expensive requests (a limit over the
      maximum, a filter on an unindexed field) as INVALID_ARGUMENT and rate-limits reads as
      RESOURCE_EXHAUSTED, with a retry-after trailer. Proven by plans/limits/strict-mode.yaml.
    adapter: updateStrictMode
    proto: qdrant.Collections/Update
    tags: [collections, limits]
    requires: [collection]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: strictModeConfig
        type: StrictModeConfig
        description: A qdrant.StrictModeConfig; enabled must be true for the rest to apply
    outputs:
      - name: updated
        type: boolean

  # --- REST cross-checks -----------------------------------------------------

  restGetCollection: &restGetCollection
    description: >-
      GET /collections/{collection_name}: the collection getCollection reads, over REST. The status
      is lowercase here, sizes are JSON numbers rather than strings, and metadata values are plain
      JSON rather than Qdrant's Value messages. Proven by plans/collections/lifecycle.yaml.
    adapter: restGetCollection
    oas:
      operationId: get_collection
    tags: [collections, rest]
    requires: [collection]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
    outputs:
      - name: status
        type: string
      - name: vectorSize
        type: integer
      - name: distance
        type: string
      - name: project
        type: string
        optional: true

  restGetPoint:
    description: >-
      GET /collections/{collection_name}/points/{id}: one point over REST. Its id is a plain
      number or string rather than a oneof, its payload plain JSON, and its unnamed vector a bare
      list under `vector`. Proven by plans/points/upsert-and-read.yaml.
    adapter: restGetPoint
    oas:
      operationId: get_point
    tags: [points, rest]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: id
        type: string
        default: {value: "1"}
    outputs:
      - name: id
        type: integer
      - name: city
        type: string
        optional: true
      - name: payload
        type: Payload
      - name: vector
        type: float[]
        optional: true

  restQueryPoints:
    description: >-
      POST /collections/{collection_name}/points/query: the nearest-neighbour query over REST, where
      the query is a bare list of numbers rather than a Query oneof, and the points sit under
      result.points. Proven by plans/query/nearest.yaml.
    adapter: restQueryPoints
    oas:
      operationId: query_points
    tags: [query, rest]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: vector
        type: float[]
      - name: limit
        type: integer
        default: {value: 3}
    outputs:
      - name: ids
        type: integer[]
      - name: scores
        type: float[]

  restSearchPoints:
    description: >-
      POST /collections/{collection_name}/points/search, the REST search that v1.19's OpenAPI spec
      no longer lists. The server still answers it, so this node has no operationId to be checked
      against. Proven by drift/deprecated-rest-search.yaml.
    adapter: restSearchPoints
    tags: [query, rest, deprecated]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: vector
        type: float[]
      - name: limit
        type: integer
        default: {value: 3}
    outputs:
      - name: ids
        type: integer[]

  restAnonGetCollection:
    <<: *restGetCollection
    description: >-
      restGetCollection with no credential: a 401 whose body is plain text, not JSON. Proven by
      plans/auth/keys.yaml.
    tags: [auth, rest]
