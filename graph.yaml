version: "1.0.0"
title: Qdrant over gRPC
description: >-
  The Qdrant vector database, driven over its gRPC API (qdrant.Collections, qdrant.Points,
  qdrant.Snapshots) against a local container. A handful of REST nodes, named rest*, read the same
  collections back over HTTP to show what each protocol makes of the same data.

# Qdrant's own protos, compiled by proto/build.sh. aat validate checks every gRPC node against
# them without a server running.
proto: qdrant.protoset

# Qdrant's own OpenAPI spec, for the rest* nodes: aat validate checks them against it, and at run
# time a response it doesn't allow fails the step (settings.oasValidation in env.yaml).
oas: openapi/openapi.json

nodes:
  # --- Health ----------------------------------------------------------------

  healthCheck:
    description: >-
      Qdrant's own health check, which answers with its version. It is one of the two calls Qdrant
      serves without a key. Proven by plans/health/checks.yaml.
    adapter: healthCheck
    proto: qdrant.Qdrant/HealthCheck
    tags: [health]
    outputs:
      - name: title
        type: string
      - name: version
        type: string
        display: Qdrant
      - name: commit
        type: string
        optional: true

  grpcHealthCheck:
    description: >-
      The standard gRPC health service (grpc.health.v1.Health/Check), the other call served without
      a key. An empty service name asks about the server as a whole. Proven by
      plans/health/checks.yaml.
    adapter: grpcHealthCheck
    proto: grpc.health.v1.Health/Check
    tags: [health]
    inputs:
      - name: service
        type: string
        optional: true
        description: A service to ask about, such as qdrant.Points; empty or absent asks about the server
    outputs:
      - name: status
        type: string
        description: SERVING, NOT_SERVING, UNKNOWN, or SERVICE_UNKNOWN

  # --- Collections -----------------------------------------------------------

  createCollection:
    description: >-
      Create a collection of dense vectors. The name is the client's to choose and Qdrant answers
      only `result: true`, so the name comes back as an output echoed from the input. Every
      collection this project creates is named aat-qdrant-*, which is what the guard looks for, and
      carries `project: aat-qdrant` in its metadata. Proven by plans/collections/lifecycle.yaml.
    adapter: createCollection
    proto: qdrant.Collections/Create
    tags: [collections]
    inputs:
      - name: collectionName
        type: string
        default: {value: "aat-qdrant-{{random 8}}"}
      - name: vectorSize
        type: integer
        default: {value: 4}
        description: Dimensions of every vector in the collection
      - name: distance
        type: enum[Cosine, Euclid, Dot, Manhattan]
        default: {value: Cosine}
    outputs:
      - name: created
        type: boolean
      - name: collectionName
        type: string
        fromInput: collectionName
    satisfies: [collection]
    cleanup:
      node: deleteCollection

  getCollection:
    description: >-
      Read a collection's status and configuration. Over gRPC the status is the enum name, `Green`;
      over REST it is `green`. Proven by plans/collections/lifecycle.yaml.
    adapter: getCollection
    proto: qdrant.Collections/Get
    tags: [collections]
    requires: [collection]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
    outputs:
      - name: status
        type: string
        description: Green, Yellow, Grey, or Red
      - name: pointsCount
        type: integer
        optional: true
      - name: segmentsCount
        type: integer
      - name: vectorSize
        type: integer
        optional: true
        description: The unnamed vector's size, when the collection has only that one
      - name: distance
        type: string
        optional: true
      - name: vectorNames
        type: string[]
        description: >-
          The names in a collection's vector map, sorted. A collection with one unnamed vector
          has none; once a named vector is added, the unnamed one is listed as "".
      - name: indexingThreshold
        type: integer
      - name: payloadSchema
        type: string[]
        description: The payload fields that have an index, sorted
      - name: project
        type: string
        optional: true
        description: The project tag in the collection's metadata
      - name: note
        type: string
        optional: true
        description: The note tag in the collection's metadata, which updateCollection sets

  listCollections:
    description: >-
      List every collection on the server. The transform counts this project's (named aat-qdrant-*),
      which is what the guard asserts is zero. Proven by plans/zz-guard/no-stray-collections.yaml.
    adapter: listCollections
    proto: qdrant.Collections/List
    tags: [collections]
    outputs:
      - name: names
        type: string[]
      - name: count
        type: integer
      - name: ourCount
        type: integer
      - name: ours
        type: string[]

  collectionExists:
    description: >-
      Whether a collection exists. `false` is a real answer rather than an error, and it arrives as
      a present `false`, not an absent field. Proven by plans/collections/missing.yaml.
    adapter: collectionExists
    proto: qdrant.Collections/CollectionExists
    tags: [collections]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
    outputs:
      - name: exists
        type: boolean

  updateCollection:
    description: >-
      Change a collection's optimizer settings and metadata in place. Metadata is merged: a key
      the update doesn't name keeps its value. Proven by plans/collections/update-optimizers.yaml.
    adapter: updateCollection
    proto: qdrant.Collections/Update
    tags: [collections]
    requires: [collection]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: indexingThreshold
        type: integer
        default: {value: 20000}
        description: Vectors a segment holds before Qdrant builds its HNSW index, in kilobytes
      - name: note
        type: string
        default: {value: updated by aat-qdrant}
        description: Written to the collection's metadata as `note`
    outputs:
      - name: updated
        type: boolean

  deleteCollection:
    description: >-
      Delete a collection and everything in it; the cleanup for createCollection. Deleting one that
      doesn't exist answers `result: false` rather than NOT_FOUND. Proven by
      plans/collections/lifecycle.yaml.
    adapter: deleteCollection
    proto: qdrant.Collections/Delete
    tags: [collections, cleanup]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
    outputs:
      - name: deleted
        type: boolean

  # --- Points ----------------------------------------------------------------

  upsertPoints:
    description: >-
      Insert or replace points. Each is a qdrant.PointStruct in proto3 JSON: an id that is a
      oneof of a uint64 (`{"num": "1"}`) or a UUID (`{"uuid": "..."}`), vectors, and a payload
      of Qdrant Value messages. The default is Qdrant's own quickstart dataset of six cities. With
      `wait` the reply comes after the write is applied (Completed); without it, as soon as it is
      accepted (Acknowledged). Proven by plans/points/upsert-and-read.yaml.
    adapter: upsertPoints
    proto: qdrant.Points/Upsert
    tags: [points]
    requires: [collection]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: points
        type: PointStruct[]
        default:
          value:
            - {id: {num: "1"}, vectors: {vector: {dense: {data: [0.05, 0.61, 0.76, 0.74]}}}, payload: {city: {stringValue: Berlin}, country: {stringValue: Germany}, population: {integerValue: "3645000"}}}
            - {id: {num: "2"}, vectors: {vector: {dense: {data: [0.19, 0.81, 0.75, 0.11]}}}, payload: {city: {stringValue: London}, country: {stringValue: UK}, population: {integerValue: "8982000"}}}
            - {id: {num: "3"}, vectors: {vector: {dense: {data: [0.36, 0.55, 0.47, 0.94]}}}, payload: {city: {stringValue: Moscow}, country: {stringValue: Russia}, population: {integerValue: "12640000"}}}
            - {id: {num: "4"}, vectors: {vector: {dense: {data: [0.18, 0.01, 0.85, 0.80]}}}, payload: {city: {stringValue: New York}, country: {stringValue: USA}, population: {integerValue: "8336000"}}}
            - {id: {num: "5"}, vectors: {vector: {dense: {data: [0.24, 0.18, 0.22, 0.44]}}}, payload: {city: {stringValue: Beijing}, country: {stringValue: China}, population: {integerValue: "21540000"}}}
            - {id: {num: "6"}, vectors: {vector: {dense: {data: [0.35, 0.08, 0.11, 0.44]}}}, payload: {city: {stringValue: Mumbai}, country: {stringValue: India}, population: {integerValue: "12480000"}}}
      - name: wait
        type: boolean
        default: {value: true}
    outputs:
      - name: status
        type: string
        description: Completed, or Acknowledged when the write was not waited for
      - name: operationId
        type: integer
        optional: true
    satisfies: [points]

  getPoints:
    description: >-
      Read points by id. An id with no point is not an error: it is left out of the result.
      Proven by plans/points/upsert-and-read.yaml.
    adapter: getPoints
    proto: qdrant.Points/Get
    tags: [points]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: ids
        type: PointId[]
        default: {value: [{num: "1"}]}
      - name: withVectors
        type: boolean
        default: {value: false}
    outputs:
      - name: count
        type: integer
      - name: ids
        type: PointId[]
      - name: cities
        type: string[]
      - name: firstPayload
        type: Payload
        optional: true
      - name: firstVector
        type: float[]
        optional: true
        description: The first point's unnamed dense vector, when it has one and withVectors is set
      - name: firstNamedVectors
        type: NamedVectors
        optional: true
        description: The first point's named vectors, when it has them and withVectors is set

  deletePoints:
    description: >-
      Delete points, chosen either by id or by a filter: the request's selector is a oneof.
      Proven by plans/points/delete-and-count.yaml.
    adapter: deletePoints
    proto: qdrant.Points/Delete
    tags: [points]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: ids
        type: PointId[]
        optional: true
      - name: filter
        type: Filter
        optional: true
    outputs:
      - name: status
        type: string

  countPoints:
    description: >-
      Count points, all of them or those a filter matches. The count is a uint64, so it arrives
      as a string. Proven by plans/points/delete-and-count.yaml.
    adapter: countPoints
    proto: qdrant.Points/Count
    tags: [points]
    requires: [collection]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: filter
        type: Filter
        optional: true
    outputs:
      - name: count
        type: integer

  scrollPoints:
    description: >-
      Page through points in id order. The cursor, nextPageOffset, is a PointId: a oneof, so it
      comes back as {"num": ...} or {"uuid": ...}, and is absent on the last page. AAT pages with
      string cursors, so the node splits it into nextNum and nextUuid, one of which is set, and
      sends back whichever came. Proven by plans/points/scroll-pages.yaml.
    adapter: scrollPoints
    proto: qdrant.Points/Scroll
    tags: [points]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: limit
        type: integer
        default: {value: 2}
      - name: offsetNum
        type: string
        optional: true
        description: Start the page at this numeric id; with neither offset, it starts at the lowest
      - name: offsetUuid
        type: string
        optional: true
        description: Start the page at this UUID id
      - name: filter
        type: Filter
        optional: true
    outputs:
      - name: ids
        type: PointId[]
      - name: cities
        type: string[]
      - name: count
        type: integer
      - name: nextPageOffset
        type: PointId
        optional: true
      - name: nextNum
        type: string
        description: The cursor's numeric id, or "" when it is a UUID or there is no next page
      - name: nextUuid
        type: string
        description: The cursor's UUID, or "" when it is numeric or there is no next page

  updateVectors:
    description: >-
      Replace the vectors of existing points, leaving their payloads alone. Proven by
      plans/points/vectors.yaml.
    adapter: updateVectors
    proto: qdrant.Points/UpdateVectors
    tags: [points, vectors]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: points
        type: PointVectors[]
        description: Each a qdrant.PointVectors in proto3 JSON, an id and its new vectors
    outputs:
      - name: status
        type: string

  deleteVectors:
    description: >-
      Remove named vectors from points, keeping the points and their payloads. The unnamed
      vector is the one named "". Proven by plans/points/vectors.yaml.
    adapter: deleteVectors
    proto: qdrant.Points/DeleteVectors
    tags: [points, vectors]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: ids
        type: PointId[]
      - name: vectorNames
        type: string[]
        default: {value: [""]}
    outputs:
      - name: status
        type: string

  setPayload:
    description: >-
      Merge values into points' payloads. With `key`, the values go under that key as a nested
      object instead of at the top level. Proven by plans/points/payload.yaml.
    adapter: setPayload
    proto: qdrant.Points/SetPayload
    tags: [points, payload]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: ids
        type: PointId[]
      - name: payload
        type: Payload
        description: A map of Qdrant Value messages, as in a point's payload
      - name: key
        type: string
        optional: true
    outputs:
      - name: status
        type: string

  overwritePayload:
    description: >-
      Replace points' payloads outright: a key the new payload doesn't have is gone. Proven by
      plans/points/payload.yaml.
    adapter: overwritePayload
    proto: qdrant.Points/OverwritePayload
    tags: [points, payload]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: ids
        type: PointId[]
      - name: payload
        type: Payload
    outputs:
      - name: status
        type: string

  deletePayload:
    description: Remove payload keys from points. Proven by plans/points/payload.yaml.
    adapter: deletePayload
    proto: qdrant.Points/DeletePayload
    tags: [points, payload]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: ids
        type: PointId[]
      - name: keys
        type: string[]
    outputs:
      - name: status
        type: string

  clearPayload:
    description: Remove every payload key from points. Proven by plans/points/payload.yaml.
    adapter: clearPayload
    proto: qdrant.Points/ClearPayload
    tags: [points, payload]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: ids
        type: PointId[]
    outputs:
      - name: status
        type: string

  updateBatch:
    description: >-
      Apply several point operations in one call, in order. Each operation is a oneof (upsert,
      setPayload, deletePoints, ...), and each gets its own result. Proven by
      plans/points/update-batch.yaml.
    adapter: updateBatch
    proto: qdrant.Points/UpdateBatch
    tags: [points]
    requires: [collection]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: operations
        type: PointsUpdateOperation[]
    outputs:
      - name: statuses
        type: string[]
      - name: count
        type: integer

  createFieldIndex:
    description: >-
      Index a payload field, which filters, facets, and ordered scrolls use. The field type is an
      enum whose zero value, FieldTypeKeyword, has to be written out, because the field is
      optional. Proven by plans/points/indexes.yaml.
    adapter: createFieldIndex
    proto: qdrant.Points/CreateFieldIndex
    tags: [points, indexes]
    requires: [collection]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: fieldName
        type: string
        default: {value: city}
      - name: fieldType
        type: enum[FieldTypeKeyword, FieldTypeInteger, FieldTypeFloat, FieldTypeGeo, FieldTypeText, FieldTypeBool, FieldTypeDatetime, FieldTypeUuid]
        default: {value: FieldTypeKeyword}
    outputs:
      - name: status
        type: string
      - name: fieldName
        type: string
        fromInput: fieldName
    cleanup:
      node: deleteFieldIndex

  deleteFieldIndex:
    description: Drop a payload field's index; the cleanup for createFieldIndex. Proven by plans/points/indexes.yaml.
    adapter: deleteFieldIndex
    proto: qdrant.Points/DeleteFieldIndex
    tags: [points, indexes, cleanup]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: fieldName
        type: string
        default: {from: createFieldIndex.fieldName}
    outputs:
      - name: status
        type: string

  createVectorName:
    description: >-
      Add a named dense vector to an existing collection. On a collection that had one unnamed
      vector, the collection's config becomes a map of named vectors, in which the unnamed one is
      named "". Proven by plans/points/vectors.yaml.
    adapter: createVectorName
    proto: qdrant.Points/CreateVectorName
    tags: [points, vectors]
    requires: [collection]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: vectorName
        type: string
        default: {value: extra}
      - name: size
        type: integer
        default: {value: 2}
      - name: distance
        type: enum[Cosine, Euclid, Dot, Manhattan]
        default: {value: Euclid}
    outputs:
      - name: status
        type: string
      - name: vectorName
        type: string
        fromInput: vectorName
    cleanup:
      node: deleteVectorName

  deleteVectorName:
    description: >-
      Remove a named vector from a collection and from every point; the cleanup for
      createVectorName. Proven by plans/points/vectors.yaml.
    adapter: deleteVectorName
    proto: qdrant.Points/DeleteVectorName
    tags: [points, vectors, cleanup]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: vectorName
        type: string
        default: {from: createVectorName.vectorName}
    outputs:
      - name: status
        type: string

  # --- Search and query ------------------------------------------------------

  queryPoints:
    description: >-
      The universal query: nearest neighbours of a vector or a point, a recommendation, discovery,
      a fusion of prefetched results, and more, each a member of the Query oneof. Without a query it
      lists points in id order. A fusion is {"fusion": "RRF"}, the enum's zero value, sent because
      it is a oneof member. Scores are float32, so assert them as ranges. Proven by
      plans/query/nearest.yaml.
    adapter: queryPoints
    proto: qdrant.Points/Query
    tags: [query]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: query
        type: Query
        optional: true
        description: "A qdrant.Query in proto3 JSON, such as {nearest: {dense: {data: [...]}}}"
      - name: prefetch
        type: PrefetchQuery[]
        optional: true
      - name: filter
        type: Filter
        optional: true
      - name: limit
        type: integer
        default: {value: 3}
    outputs:
      - name: nums
        type: string[]
        description: The numeric ids of the points found, best first (uint64s, so strings)
      - name: ids
        type: PointId[]
      - name: scores
        type: float[]
      - name: cities
        type: string[]
      - name: count
        type: integer
      - name: topScore
        type: float
        optional: true

  queryBatch:
    description: >-
      Several queries in one call, each answered on its own. Every query in the batch has to name
      the collection again: the template writes it into each. Proven by plans/query/batches.yaml.
    adapter: queryBatch
    proto: qdrant.Points/QueryBatch
    tags: [query]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: queries
        type: QueryItem[]
        description: Each {query, limit}, as queryPoints takes them
    outputs:
      - name: batches
        type: NumLists
        description: For each request in the batch, the numeric ids it found, best first
      - name: count
        type: integer

  queryGroups:
    description: >-
      A query whose results are grouped by a payload field, a few hits per group. A group's key is
      a GroupId oneof. Proven by plans/query/groups.yaml.
    adapter: queryGroups
    proto: qdrant.Points/QueryGroups
    tags: [query]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: query
        type: Query
      - name: groupBy
        type: string
        default: {value: country}
      - name: groupSize
        type: integer
        default: {value: 1}
      - name: limit
        type: integer
        default: {value: 2}
    outputs:
      - name: groupIds
        type: string[]
        description: Each group's key, a GroupId oneof read as its string value
      - name: hitNums
        type: NumLists
        description: The numeric ids in each group, best first
      - name: count
        type: integer

  facet:
    description: >-
      Count points by the values of a payload field. It needs an index on the field that supports
      exact matches, such as a keyword index, and says so when there is none. Hits are ordered by
      count, then by value. Proven by plans/query/facet.yaml.
    adapter: facet
    proto: qdrant.Points/Facet
    tags: [query]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: key
        type: string
        default: {value: country}
      - name: limit
        type: integer
        default: {value: 10}
    outputs:
      - name: values
        type: string[]
      - name: counts
        type: integer[]
      - name: count
        type: integer

  searchMatrixPairs:
    description: >-
      For a sample of points, each one's nearest neighbours, as pairs. Proven by
      plans/query/matrix.yaml.
    adapter: searchMatrixPairs
    proto: qdrant.Points/SearchMatrixPairs
    tags: [query]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: sample
        type: integer
        default: {value: 6}
      - name: limit
        type: integer
        default: {value: 1}
    outputs:
      - name: count
        type: integer
      - name: aNums
        type: string[]
      - name: bNums
        type: string[]

  searchMatrixOffsets:
    description: >-
      The same matrix as searchMatrixPairs, as a sparse matrix: row and column offsets into a list
      of ids, and a score for each. Proven by plans/query/matrix.yaml.
    adapter: searchMatrixOffsets
    proto: qdrant.Points/SearchMatrixOffsets
    tags: [query]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: sample
        type: integer
        default: {value: 6}
      - name: limit
        type: integer
        default: {value: 1}
    outputs:
      - name: offsetsRow
        type: string[]
      - name: offsetsCol
        type: string[]
      - name: idNums
        type: string[]
      - name: scores
        type: float[]

  # --- Search and query: the deprecated RPCs --------------------------------
  # Marked deprecated in the protos in favour of Query, and still served.

  searchPoints:
    description: >-
      Nearest neighbours of a vector (deprecated; Query does this). Proven by
      plans/query/nearest.yaml.
    adapter: searchPoints
    proto: qdrant.Points/Search
    tags: [query, deprecated]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: vector
        type: float[]
      - name: limit
        type: integer
        default: {value: 3}
    outputs:
      - name: nums
        type: string[]
        description: The numeric ids of the points found, best first (uint64s, so strings)
      - name: ids
        type: PointId[]
      - name: scores
        type: float[]
      - name: cities
        type: string[]
      - name: count
        type: integer
      - name: topScore
        type: float
        optional: true

  searchBatch:
    description: >-
      Several searches in one call (deprecated; QueryBatch does this). Each names the collection
      again. Proven by plans/query/batches.yaml.
    adapter: searchBatch
    proto: qdrant.Points/SearchBatch
    tags: [query, deprecated]
    requires: [points]
    inputs:
      - name: collectionName
        type: string
        default: {from: createCollection.collectionName}
      - name: searches
        type: SearchItem[]
        description: Each {vector, limit}
    outputs:
      - name: batches
        type: NumLists
